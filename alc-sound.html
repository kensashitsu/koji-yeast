<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>アルコール上昇音えらび</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#f3eee4;color:#5c5344;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic Medium",sans-serif;
    -webkit-user-select:none;user-select:none}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:20px;font-weight:800;letter-spacing:.03em;text-align:center;margin:6px 0 4px}
  p.lead{font-size:13px;color:#8a7f6d;text-align:center;line-height:1.6;margin-bottom:18px}
  .card{background:#fff;border:1.5px solid #e7ddca;border-radius:16px;padding:14px 15px;margin:0 0 12px;
    box-shadow:0 4px 14px rgba(150,130,100,.12)}
  .card .nm{font-size:15px;font-weight:700;color:#6a5c46}
  .card .ds{font-size:12px;color:#a89c88;margin-top:3px;line-height:1.5}
  .card button{margin-top:11px;width:100%;font-family:inherit;font-weight:700;font-size:15px;color:#fff;border:none;
    cursor:pointer;border-radius:12px;padding:13px;background:linear-gradient(180deg,#e8b658,#d69a34);
    box-shadow:0 4px 0 #b07f22;transition:transform .07s}
  .card button:active{transform:translateY(2px);box-shadow:0 1px 0 #b07f22}
  .card.play{border-color:#d69a34;box-shadow:0 0 0 2px #e8b65855,0 4px 14px rgba(150,130,100,.18)}
  .note{font-size:12px;color:#a89c88;text-align:center;margin-top:8px;line-height:1.6}
  .bar{height:8px;border-radius:5px;background:rgba(120,140,165,.16);margin:10px 0 0;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a6cbea,#5286bd)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍶 アルコール上昇音 えらび</h1>
  <p class="lead">アルコールゲージが上がっている間に鳴らす音の候補です。<br>各ボタンで約2.5秒（ゲージが上がる想定）鳴ります。<br>気に入った<b>番号</b>を伝えてください（音量・強さは後で調整可）。</p>
  <div id="list"></div>
  <p class="note">※スマホは最初のタップで音が有効になります。マナーモードだと鳴らないことがあります。</p>
</div>
<script>
(()=>{
let ac=null;
const actx=()=>{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; };
const DUR=2.5;   // 鳴らす長さ

// アルコール量 al(0→1)を DUR 秒でゆっくり上げる想定のエンベロープ用ヘルパは各音内で time で表現。
// 各候補は {name, desc, play(a,t0)} を持つ。t0=開始時刻。共通で out(gain)を作り本体を接続。
function envGain(a,t0,peak){ // フェードイン→保持→フェードアウト
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak,t0+0.35);
  g.gain.setValueAtTime(peak,t0+DUR-0.4);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+DUR);
  return g;
}
function noiseBuf(a,sec){ const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }

const CANDS=[
 { name:'① 柔らかいうなり（今の音）', desc:'低いノコギリ波をこもらせた「ふつふつ」。今ゲームに入っている音。',
   play(a,t0){ const out=envGain(a,t0,0.09); out.connect(a.destination);
     const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=82;
     const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=340; f.Q.value=7;
     const lfo=a.createOscillator(); lfo.type='sine'; lfo.frequency.value=6.5; const lg=a.createGain(); lg.gain.value=0.02;
     o.connect(f).connect(out); lfo.connect(lg).connect(out.gain); o.start(t0); lfo.start(t0); o.stop(t0+DUR); lfo.stop(t0+DUR); } },

 { name:'② ぷくぷく（発酵の泡）', desc:'ゆっくりした丸い泡がぽつぽつ湧く。だんだん増える。',
   play(a,t0){ const out=a.createGain(); out.gain.value=0.9; out.connect(a.destination);
     // t0..t0+DUR にかけて泡の頻度を上げる
     let t=t0+0.1;
     while(t<t0+DUR-0.1){ const prog=(t-t0)/DUR;
       const o=a.createOscillator(), g=a.createGain(); o.type='sine';
       const f0=180+Math.random()*120; o.frequency.setValueAtTime(f0*1.6,t); o.frequency.exponentialRampToValueAtTime(f0,t+0.06);
       g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.10*(0.5+prog),t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
       o.connect(g).connect(out); o.start(t); o.stop(t+0.15);
       t += 0.16 - prog*0.10 + Math.random()*0.08;   // だんだん間隔が詰まる
     } } },

 { name:'③ しゅわしゅわ（炭酸）', desc:'細かい泡の弾ける炭酸のフィズ。上がるほど強く。',
   play(a,t0){ const out=envGain(a,t0,0.14); out.connect(a.destination);
     const s=a.createBufferSource(); s.buffer=noiseBuf(a,DUR+0.2); s.loop=true;
     const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5500; bp.Q.value=1.2;
     const hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000;
     s.connect(hp).connect(bp).connect(out); s.start(t0); s.stop(t0+DUR); } },

 { name:'④ ことこと煮える', desc:'水がくつくつ沸くような、低くこもったゆらぎ。',
   play(a,t0){ const out=envGain(a,t0,0.16); out.connect(a.destination);
     const s=a.createBufferSource(); s.buffer=noiseBuf(a,DUR+0.2); s.loop=true;
     const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; lp.Q.value=9;
     const lfo=a.createOscillator(); lfo.type='sine'; lfo.frequency.value=9; const lg=a.createGain(); lg.gain.value=140;
     lfo.connect(lg).connect(lp.frequency); lfo.start(t0); lfo.stop(t0+DUR);
     s.connect(lp).connect(out); s.start(t0); s.stop(t0+DUR); } },

 { name:'⑤ やわらかいサイン', desc:'クリーンなサイン波の温かいうなり。ビブラート付き。雑味なし。',
   play(a,t0){ const out=envGain(a,t0,0.10); out.connect(a.destination);
     const o=a.createOscillator(); o.type='sine'; o.frequency.value=160;
     const o2=a.createOscillator(); o2.type='sine'; o2.frequency.value=160*1.5; const g2=a.createGain(); g2.gain.value=0.3;
     const vib=a.createOscillator(); vib.type='sine'; vib.frequency.value=5.5; const vg=a.createGain(); vg.gain.value=4;
     vib.connect(vg).connect(o.frequency); vib.start(t0); vib.stop(t0+DUR);
     o.connect(out); o2.connect(g2).connect(out); o.start(t0); o2.start(t0); o.stop(t0+DUR); o2.stop(t0+DUR); } },

 { name:'⑥ 上昇トーン（ゲージUP）', desc:'音程がじわじわ上がる＝「ゲージが上がってる」感。',
   play(a,t0){ const out=envGain(a,t0,0.08); out.connect(a.destination);
     const o=a.createOscillator(); o.type='triangle';
     o.frequency.setValueAtTime(140,t0); o.frequency.exponentialRampToValueAtTime(300,t0+DUR);   // 上がる
     const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(500,t0); f.frequency.exponentialRampToValueAtTime(1400,t0+DUR); f.Q.value=4;
     const lfo=a.createOscillator(); lfo.type='sine'; lfo.frequency.value=7; const lg=a.createGain(); lg.gain.value=0.015;
     lfo.connect(lg).connect(out.gain); lfo.start(t0); lfo.stop(t0+DUR);
     o.connect(f).connect(out); o.start(t0); o.stop(t0+DUR); } },
];

const list=document.getElementById('list');
CANDS.forEach((c,i)=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="nm">${c.name}</div><div class="ds">${c.desc}</div>
    <div class="bar"><i></i></div><button>▶ 鳴らす（約2.5秒）</button>`;
  const bar=card.querySelector('.bar i');
  card.querySelector('button').addEventListener('click',()=>{
    const a=actx(), t0=a.currentTime+0.02;
    try{ c.play(a,t0); }catch(e){ alert('再生エラー: '+e.message); }
    // ゲージが上がる見た目も同期
    card.classList.add('play'); bar.style.transition='none'; bar.style.width='0%';
    requestAnimationFrame(()=>{ bar.style.transition='width 2.5s linear'; bar.style.width='100%'; });
    setTimeout(()=>{ card.classList.remove('play'); bar.style.transition='width .3s'; bar.style.width='0%'; }, 2600);
  });
  list.appendChild(card);
});
})();
</script>
</body>
</html>
