<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>アルコール上昇音えらび</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#f3eee4;color:#5c5344;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic Medium",sans-serif;
    -webkit-user-select:none;user-select:none}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:20px;font-weight:800;letter-spacing:.03em;text-align:center;margin:6px 0 4px}
  p.lead{font-size:13px;color:#8a7f6d;text-align:center;line-height:1.6;margin-bottom:18px}
  .card{background:#fff;border:1.5px solid #e7ddca;border-radius:16px;padding:14px 15px;margin:0 0 12px;
    box-shadow:0 4px 14px rgba(150,130,100,.12)}
  .card .nm{font-size:15px;font-weight:700;color:#6a5c46}
  .card .ds{font-size:12px;color:#a89c88;margin-top:3px;line-height:1.5}
  .card button{margin-top:11px;width:100%;font-family:inherit;font-weight:700;font-size:15px;color:#fff;border:none;
    cursor:pointer;border-radius:12px;padding:13px;background:linear-gradient(180deg,#e8b658,#d69a34);
    box-shadow:0 4px 0 #b07f22;transition:transform .07s}
  .card button:active{transform:translateY(2px);box-shadow:0 1px 0 #b07f22}
  .card.play{border-color:#d69a34;box-shadow:0 0 0 2px #e8b65855,0 4px 14px rgba(150,130,100,.18)}
  .note{font-size:12px;color:#a89c88;text-align:center;margin-top:8px;line-height:1.6}
  .bar{height:8px;border-radius:5px;background:rgba(120,140,165,.16);margin:10px 0 0;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a6cbea,#5286bd)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍶 アルコール上昇音 えらび</h1>
  <p class="lead">アルコールゲージが上がっている間に鳴らす音の候補です。<br>各ボタンで約2.5秒（ゲージが上がる想定）鳴ります。<br>気に入った<b>番号</b>を伝えてください（音量・強さは後で調整可）。</p>
  <div id="list"></div>
  <p class="note">※スマホは最初のタップで音が有効になります。マナーモードだと鳴らないことがあります。</p>
</div>
<script>
(()=>{
let ac=null;
const actx=()=>{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; };
const DUR=2.5;   // 鳴らす長さ

// アルコール量 al(0→1)を DUR 秒でゆっくり上げる想定のエンベロープ用ヘルパは各音内で time で表現。
// 各候補は {name, desc, play(a,t0)} を持つ。t0=開始時刻。共通で out(gain)を作り本体を接続。
function envGain(a,t0,peak){ // フェードイン→保持→フェードアウト
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak,t0+0.35);
  g.gain.setValueAtTime(peak,t0+DUR-0.4);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+DUR);
  return g;
}
function noiseBuf(a,sec){ const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }

// 「トゥク」1粒＝丸い水の粒の音。頭に「t」の当たり(短ノイズ)＋「ウ」の丸い共鳴(サインが少し落ちる)。round=丸さ。
function tuk(a,t,out,freq,vol,round){
  round=round||1;
  // 「t」の当たり（ごく短いノイズ）
  const len=Math.floor(a.sampleRate*0.007), nb=a.createBuffer(1,len,a.sampleRate), d=nb.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const ns=a.createBufferSource(); ns.buffer=nb;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq*2.4; bp.Q.value=1.2;
  const ng=a.createGain(); ng.gain.value=vol*0.35/round;   // 丸いほど当たりは控えめ
  ns.connect(bp).connect(ng).connect(out); ns.start(t);
  // 「ウ」の丸い共鳴（ピッチが立ち上がりから少し落ちる＝トゥクの丸み）
  const o=a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(freq*1.5,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.035*round);
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.09*round);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=freq*4; lp.Q.value=1.5;
  o.connect(lp).connect(g).connect(out); o.start(t); o.stop(t+0.12*round);
}
// t0..t0+DUR に「トゥク」を並べる。base 音程が f0→f1 に上昇。gap0→gap1 で間隔変化（満ちるほど詰めたい時）。
function tukSeq(a,t0,out,f0,f1,gap0,gap1,vol,round){
  let t=t0+0.04;
  while(t<t0+DUR-0.02){ const u=(t-t0)/DUR;
    const f=f0*Math.pow(f1/f0,u)*(0.98+Math.random()*0.04);   // わずかにゆらぐ
    tuk(a,t,out,f,vol,round);
    t += gap0+(gap1-gap0)*u;
  }
}
const CANDS=[
 { name:'① トゥクトゥク（基本）', desc:'水を注ぐたび「トゥク…トゥク」と丸い粒。注ぐほど1粒ずつ音程が上がる。',
   play(a,t0){ const out=a.createGain(); out.gain.value=0.9; out.connect(a.destination);
     tukSeq(a,t0,out, 280,760, 0.19,0.19, 0.16, 1); } },

 { name:'② トゥクトゥク（満ちるほど速く）', desc:'満ちてくるほど「トゥクトゥクッ」と間隔が詰まって音程も上がる。満杯感が出る。',
   play(a,t0){ const out=a.createGain(); out.gain.value=0.9; out.connect(a.destination);
     tukSeq(a,t0,out, 260,820, 0.24,0.10, 0.16, 1); } },

 { name:'③ トゥクトゥク（低め・丸い）', desc:'①より低くてこもった、丸い「トゥク」。落ち着いた水音。',
   play(a,t0){ const out=a.createGain(); out.gain.value=0.9; out.connect(a.destination);
     tukSeq(a,t0,out, 190,520, 0.21,0.21, 0.17, 1.5); } },
];

const list=document.getElementById('list');
CANDS.forEach((c,i)=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="nm">${c.name}</div><div class="ds">${c.desc}</div>
    <div class="bar"><i></i></div><button>▶ 鳴らす（約2.5秒）</button>`;
  const bar=card.querySelector('.bar i');
  card.querySelector('button').addEventListener('click',()=>{
    const a=actx(), t0=a.currentTime+0.02;
    try{ c.play(a,t0); }catch(e){ alert('再生エラー: '+e.message); }
    // ゲージが上がる見た目も同期
    card.classList.add('play'); bar.style.transition='none'; bar.style.width='0%';
    requestAnimationFrame(()=>{ bar.style.transition='width 2.5s linear'; bar.style.width='100%'; });
    setTimeout(()=>{ card.classList.remove('play'); bar.style.transition='width .3s'; bar.style.width='0%'; }, 2600);
  });
  list.appendChild(card);
});
})();
</script>
</body>
</html>
