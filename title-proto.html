<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Ｙースト タイトル案くらべ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#f3eee4;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  /* 背景：うっすらお椀＋クリームのぼかし（本編タイトルと同じ雰囲気） */
  .bowl{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);width:118vw;height:118vw;max-width:118vh;max-height:118vh;
    border-radius:50%;background:radial-gradient(circle at 42% 40%,#e6f0f8 0%,rgb(222,238,250) 22%,rgb(195,222,244) 100%)}
  .veil{position:fixed;inset:0;background:rgba(243,238,228,.80);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  /* タブ */
  .tabs{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;z-index:30;display:flex;gap:6px;justify-content:center}
  .tabs button{font-family:inherit;font-weight:700;font-size:12.5px;color:#8a7f6d;background:rgba(255,255,255,.7);
    border:none;border-radius:20px;padding:8px 13px;box-shadow:0 1px 4px rgba(150,130,100,.2);cursor:pointer}
  .tabs button.on{color:#fff;background:linear-gradient(180deg,#e8b658,#d69a34)}
  /* タイトル本体 */
  .ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .ov h1{margin:0;font-weight:800;color:#6a5c46}
  .tag{font-weight:500;color:#8a7f6d}
  .tag b{color:#c58a2e;font-weight:700}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btnrow button{font-family:inherit;font-weight:700;font-size:16px;letter-spacing:.02em;border:none;border-radius:13px;padding:14px 20px;min-width:144px}
  .prim{color:#fff;background:linear-gradient(180deg,#e8b658,#d69a34);box-shadow:0 5px 0 #b07f22}
  .ghost{color:#c58a2e;background:transparent;box-shadow:0 0 0 2px #e2ba79 inset}
  .vv{font-size:11px;letter-spacing:.08em;color:#bdb19a}
  .kun{filter:drop-shadow(0 6px 14px rgba(150,130,100,.28))}
  .hide{display:none}
  /* ①現行のサイズ感 */
  .v1 h1{font-size:42px;letter-spacing:.05em}
  .v1 .kun{margin-bottom:8px}
  .v1 .tag{margin:12px 0 0;font-size:13.5px;line-height:1.75;letter-spacing:.02em;max-width:19em}
  .v1 .btnrow{margin-top:28px}
  .v1 .vv{margin-top:24px}
  /* ②③整え：字を少し大きく・字間広め・余白ゆったり */
  .v2 h1{font-size:46px;letter-spacing:.12em}
  .v2 .kun{margin-bottom:14px}
  .v2 .tag{margin:16px 0 0;font-size:13.5px;line-height:1.9;letter-spacing:.04em;max-width:18em}
  .v2 .btnrow{margin-top:34px}
  .v2 .vv{margin-top:26px}
  /* ③のキラッ */
  @keyframes twinkle{0%,72%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}88%{opacity:.85;transform:scale(1.05)}}
  @keyframes shine{0%,70%,100%{opacity:0}80%{opacity:.9}92%{opacity:0}}
  .glint .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
  .glint .shine{animation:shine 3.2s ease-in-out infinite}
</style></head>
<body>
<div class="bowl"></div><div class="veil"></div>

<div class="tabs">
  <button data-v="1" class="on">①現行</button>
  <button data-v="2">②整え</button>
  <button data-v="3">③整え+キラッ</button>
</div>

<!-- ①現行：本編そのまま -->
<div class="ov v1" id="ov1">
  <svg class="kun" viewBox="0 0 120 120" width="98" height="98" aria-hidden="true">
    <defs><radialGradient id="yk1" cx="38%" cy="34%" r="72%"><stop offset="0" stop-color="#fbeccd"/><stop offset="1" stop-color="#e3ba7e"/></radialGradient></defs>
    <line x1="47" y1="49" x2="61" y2="61" stroke="#7a5014" stroke-width="13" stroke-linecap="round" opacity=".5"/>
    <line x1="47" y1="49" x2="61" y2="61" stroke="#f5c033" stroke-width="9" stroke-linecap="round"/>
    <circle cx="41" cy="43" r="18" fill="url(#yk1)" stroke="rgba(120,85,40,.4)" stroke-width="2.4"/>
    <circle cx="71" cy="67" r="30" fill="url(#yk1)" stroke="rgba(120,85,40,.4)" stroke-width="2.4"/>
    <ellipse cx="56" cy="73" rx="7" ry="5.5" fill="rgba(232,150,150,.42)"/>
    <ellipse cx="86" cy="73" rx="7" ry="5.5" fill="rgba(232,150,150,.42)"/>
    <circle cx="62" cy="62" r="3.7" fill="#5a4028"/><circle cx="80" cy="62" r="3.7" fill="#5a4028"/>
    <path d="M64 70 Q71 77 78 70" fill="none" stroke="#5a4028" stroke-width="3.4" stroke-linecap="round"/>
  </svg>
  <h1>Ｙースト</h1>
  <p class="tag"><b>金の首</b>を さっと なぞって<br>酵母を <b>ちぎって増やす</b>。<br>制限時間内に どこまで増やせる？</p>
  <div class="btnrow"><button class="prim">はじめる</button><button class="ghost">あそびかた</button></div>
  <div class="vv">proto</div>
</div>

<!-- ②整え：アイコン上質化＋字組み。③は同じ＋キラッ -->
<div class="ov v2 hide" id="ov2">
  <svg class="kun ykbig" viewBox="0 0 130 130" width="124" height="124" aria-hidden="true">
    <defs>
      <radialGradient id="yk2" cx="38%" cy="32%" r="74%"><stop offset="0" stop-color="#fdf0d4"/><stop offset=".55" stop-color="#f0cf94"/><stop offset="1" stop-color="#e0b473"/></radialGradient>
    </defs>
    <!-- 金の首：暗い下地＋金＋明るい芯（＝立体的にくっきり） -->
    <line x1="50" y1="52" x2="66" y2="66" stroke="#7a5014" stroke-width="14" stroke-linecap="round" opacity=".5"/>
    <line x1="50" y1="52" x2="66" y2="66" stroke="#f2bd34" stroke-width="10" stroke-linecap="round"/>
    <line x1="50" y1="52" x2="66" y2="66" stroke="#ffe08a" stroke-width="4" stroke-linecap="round"/>
    <!-- 芽（子）と母体 -->
    <circle cx="44" cy="46" r="19.5" fill="url(#yk2)" stroke="rgba(120,85,40,.38)" stroke-width="2.4"/>
    <circle cx="77" cy="72" r="32.5" fill="url(#yk2)" stroke="rgba(120,85,40,.38)" stroke-width="2.4"/>
    <!-- ツヤ（白ハイライト） -->
    <ellipse cx="66" cy="58" rx="11" ry="7" fill="rgba(255,255,255,.5)"/>
    <ellipse cx="38" cy="40" rx="6" ry="4" fill="rgba(255,255,255,.5)"/>
    <!-- 顔 -->
    <ellipse cx="61" cy="79" rx="7.5" ry="5.8" fill="rgba(232,150,150,.45)"/>
    <ellipse cx="93" cy="79" rx="7.5" ry="5.8" fill="rgba(232,150,150,.45)"/>
    <circle cx="67" cy="67" r="3.9" fill="#5a4028"/><circle cx="86" cy="67" r="3.9" fill="#5a4028"/>
    <path d="M69 76 Q77 84 85 76" fill="none" stroke="#5a4028" stroke-width="3.6" stroke-linecap="round"/>
    <!-- キラッ（③でのみアニメ。②は静止のミニ星） -->
    <g class="gg">
      <circle class="shine" cx="58" cy="59" r="9" fill="rgba(255,255,255,.55)"/>
      <path class="spark" d="M58 51 L60 58 L67 59 L60 60 L58 67 L56 60 L49 59 L56 58 Z" fill="#fff"/>
    </g>
  </svg>
  <h1>Ｙースト</h1>
  <p class="tag"><b>金の首</b>を さっと なぞって<br>酵母を <b>ちぎって増やす</b>。<br>どこまで増やせる？</p>
  <div class="btnrow"><button class="prim">はじめる</button><button class="ghost">あそびかた</button></div>
  <div class="vv">proto</div>
</div>

<script>
  const ovs={1:document.getElementById('ov1'),2:document.getElementById('ov2')};
  const svg2=ovs[2].querySelector('.ykbig');
  function show(v){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    ovs[1].classList.toggle('hide', v!=='1');
    ovs[2].classList.toggle('hide', v==='1');
    // ③だけキラッを有効化
    svg2.classList.toggle('glint', v==='3');
  }
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
  // タイトルのボタンは飾り（プロトなので何もしない）
</script>
</body></html>
